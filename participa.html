<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="estilos-participa.css">
        <link rel="icon" type="image/jpg" href="logo-2ruedas.jpg" />
        <title>Participación Sorteo Entrada</title>
    </head>
    <body>
        <div class="overlay">
            <nav>
                <ul>
                    <li><a href="https://dosruedas.feriavalencia.com/">Nuestra Web</a></li>
                    <li><a href="https://dosruedas.feriavalencia.com/contacto/">Contacto</a></li>
                    <li><a href="https://dosruedas.feriavalencia.com/visitar/">Comprar Entradas</a></li>
                </ul>
            </nav>
        <div>

        <main class="header">
            <header>
                <a href="https://dosruedas.feriavalencia.com/" target="_blank" rel="noopener">
                    <img class="zoom1" src="imagen-dosruedas.jpg" alt="Dos Ruedas" />
                </a>
                <a href="https://www.feriavalencia.com/" target="_blank" rel="noopener">
                    <img class="zoom2" src="feria-valencia.jpg" alt="Feria Valencia" />
                </a>
            </header>
        </main>

        <main>
            <form id="raffleForm" novalidate>
            <h1>Participa en el Sorteo</h1>
            <div class="form-group">
                <label for="nombre">Nombre *</label>
                <input type="text" id="nombre" name="nombre" required minlength="2" placeholder="Tu nombre" />
                <div class="error" id="nombreError"></div>
            </div>
            <div class="form-group">
                <label for="apellidos">Apellidos *</label>
                <input type="text" id="apellidos" name="apellidos" required minlength="2" placeholder="Tus apellidos" />
                <div class="error" id="apellidosError"></div>
            </div>
            <div class="form-group">
                <label for="edad">Edad *</label>
                <input type="number" id="edad" name="edad" required min="18" max="120" placeholder="Tu edad" />
                <div class="error" id="edadError"></div>
            </div>
            <div class="form-group">
                <label for="email">Correo Electrónico *</label>
                <input type="email" id="email" name="email" required placeholder="tu@ejemplo.com" />
                <div class="error" id="emailError"></div>
            </div>
            <div class="form-group">
                <label for="telefono">Número de Teléfono *</label>
                <input type="tel" id="telefono" name="telefono" required pattern="\\+?[0-9\\s-]{7,15}" placeholder="+34 600 000 000" />
                <div class="error" id="telefonoError"></div>
            </div>
            <div class="form-group">
                <label for="codigoPostal">Código Postal *</label>
                <input type="text" id="codigoPostal" name="codigoPostal" required pattern="\\d{4,6}" placeholder="Código Postal" />
                <div class="error" id="codigoPostalError"></div>
            </div>

            <button type="submit">Participar</button>
            <div class="confirmation" id="confirmationMessage" aria-live="polite"></div>
            </form>
        </main>

        <footer>
            <a href="https://www.mapfre.es/particulares/">
                <img src="mapfre-patrocinador.jpg" alt="Logo Mapfre" />
            </a>

            <a href="https://www.caixapopular.es/es">
                <img src="caixa-colab.jpg" alt="Logo Caixa" />
            </a>

            <a href="https://www.gva.es/va/inicio/presentacion">
                <img src="marca-generalitat-valenciana-2017.svg" alt="Logo Generalitat Valenciana" />
            </a>

            <a href="https://www.comunitatvalenciana.com/es/turismo-deportivo/btt-cicloturismo-y-ciclismo">
                <img src="cv-colab.jpg" alt="Logo Comunitat Valenciana" />
            </a>

            <a href="https://www.escueladeconductores.es/">
                <img src="escuela-colab.jpg" alt="Logo Escuela de Conductores" />
            </a>

            <a href="https://maximo-moto.com/">
                <img src="bela-colab.jpg" alt="Logo Bela" />
            </a>

            <a href="https://arrozdacsa.com/">
                <img src="dacsa-colab.jpg" alt="Logo Arroz Dacsa" />
            </a>
        </footer>

        <form id="raffleForm" novalidate>
            <!-- Campos del formulario -->
            <button type="submit">Participar</button>
            <div class="confirmation" id="confirmationMessage" aria-live="polite"></div>
        </form>

        <script>
            const form = document.getElementById('raffleForm');
            const confirmationMessage = document.getElementById('confirmationMessage');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                confirmationMessage.textContent = '';

                // Validar campos (puedes usar tu lógica de validación aquí)

                const formData = new FormData(form);
                const data = Object.fromEntries(formData.entries());

                try {
                    const response = await fetch('http://localhost:3000/mysql', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(data),
                    });

                    if (response.ok) {
                        confirmationMessage.textContent = '¡Participación enviada con éxito!';
                        confirmationMessage.style.color = '#4caf50';
                        form.reset();
                    } else {
                        confirmationMessage.textContent = 'Error al enviar la participación.';
                        confirmationMessage.style.color = '#ef5350';
                    }
                } catch (error) {
                    confirmationMessage.textContent = 'Error de conexión.';
                    confirmationMessage.style.color = '#ef5350';
                }
            });
        </script>

    </body>
</html>
